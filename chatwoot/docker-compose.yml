version: "3.8"

# Chatwoot headless stack for Turbo Track
# Multi-tenant: each client = 1 Account in Chatwoot
# Follows EMP-52 (Semana 1) — prepares for Evolution API integration in Semana 2

x-chatwoot-env: &chatwoot-env
  env_file:
    - .env.chatwoot

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatwoot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chatwoot_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatwoot} -d ${POSTGRES_DB:-chatwoot_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - chatwoot_net

  # ---------------------------------------------------------------------------
  # Redis (required for Sidekiq + ActionCable)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chatwoot_net

  # ---------------------------------------------------------------------------
  # Chatwoot Web (Rails + Puma)
  # ---------------------------------------------------------------------------
  chatwoot-web:
    image: chatwoot/chatwoot:v3.12.0
    restart: unless-stopped
    <<: *chatwoot-env
    command: sh -c "bundle exec rails db:chatwoot_prepare && bundle exec rails s -b 0.0.0.0 -p 3000"
    ports:
      - "${CHATWOOT_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatwoot_storage:/app/storage
      - chatwoot_public:/app/public
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/auth/sign_in"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - chatwoot_net

  # ---------------------------------------------------------------------------
  # Chatwoot Worker (Sidekiq — background jobs)
  # ---------------------------------------------------------------------------
  chatwoot-worker:
    image: chatwoot/chatwoot:v3.12.0
    restart: unless-stopped
    <<: *chatwoot-env
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - chatwoot_net

volumes:
  postgres_data:
  redis_data:
  chatwoot_storage:
  chatwoot_public:

networks:
  chatwoot_net:
    driver: bridge
