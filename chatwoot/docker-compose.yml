version: "3.8"

# Chatwoot headless stack for Turbo Track
# Multi-tenant: each client = 1 Account in Chatwoot
# Follows EMP-52 (Semana 1) — prepares for Evolution API integration in Semana 2
#
# Memory budget (hard limits enforced by Docker):
#   chatwoot-db:      MEM_LIMIT_POSTGRES  (default 256m)
#   chatwoot-redis:   MEM_LIMIT_REDIS     (default 256m)
#   chatwoot-web:     MEM_LIMIT_WEB       (default 512m)
#   chatwoot-worker:  MEM_LIMIT_WORKER    (default 512m)
#   -----------------------------------------------
#   Total ceiling:    ~1.5 GB
#
# Service names are prefixed with "chatwoot-" to avoid DNS conflicts
# when the chatwoot-web container is attached to the shared Traefik coolify network.

x-chatwoot-env: &chatwoot-env
  env_file:
    - .env.chatwoot

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  chatwoot-db:
    image: postgres:15-alpine
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT_POSTGRES:-256m}
    memswap_limit: ${MEM_LIMIT_POSTGRES:-256m}
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatwoot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chatwoot_production}
    volumes:
      - chatwoot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatwoot} -d ${POSTGRES_DB:-chatwoot_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - chatwoot_net

  # ---------------------------------------------------------------------------
  # Redis (required for Sidekiq + ActionCable)
  # ---------------------------------------------------------------------------
  chatwoot-redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT_REDIS:-256m}
    memswap_limit: ${MEM_LIMIT_REDIS:-256m}
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 200mb --maxmemory-policy allkeys-lru
    volumes:
      - chatwoot_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chatwoot_net

  # ---------------------------------------------------------------------------
  # Chatwoot Web (Rails + Puma) — exposto via Traefik com SSL
  # ---------------------------------------------------------------------------
  chatwoot-web:
    image: chatwoot/chatwoot:v3.12.0
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT_WEB:-512m}
    memswap_limit: ${MEM_LIMIT_WEB:-512m}
    <<: *chatwoot-env
    command: sh -c "bundle exec rails db:chatwoot_prepare && bundle exec rails s -b 0.0.0.0 -p 3000"
    ports:
      - "${CHATWOOT_PORT:-3000}:3000"
    depends_on:
      chatwoot-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    volumes:
      - chatwoot_storage:/app/storage
      - chatwoot_public:/app/public
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f puma || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.chatwoot-gzip.compress=true
      - traefik.http.middlewares.chatwoot-redirect-https.redirectscheme.scheme=https
      - traefik.http.routers.http-chatwoot.entryPoints=http
      - traefik.http.routers.http-chatwoot.middlewares=chatwoot-redirect-https
      - "traefik.http.routers.http-chatwoot.rule=Host(`chat.respondipravoce.com.br`)"
      - traefik.http.routers.http-chatwoot.service=chatwoot-svc
      - traefik.http.routers.https-chatwoot.entryPoints=https
      - traefik.http.routers.https-chatwoot.middlewares=chatwoot-gzip
      - "traefik.http.routers.https-chatwoot.rule=Host(`chat.respondipravoce.com.br`)"
      - traefik.http.routers.https-chatwoot.service=chatwoot-svc
      - traefik.http.routers.https-chatwoot.tls.certresolver=letsencrypt
      - traefik.http.routers.https-chatwoot.tls=true
      - traefik.http.services.chatwoot-svc.loadbalancer.server.port=3000
    networks:
      - chatwoot_net
      - coolify

  # ---------------------------------------------------------------------------
  # Chatwoot Worker (Sidekiq — background jobs)
  # ---------------------------------------------------------------------------
  chatwoot-worker:
    image: chatwoot/chatwoot:v3.12.0
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT_WORKER:-512m}
    memswap_limit: ${MEM_LIMIT_WORKER:-512m}
    <<: *chatwoot-env
    command: bundle exec sidekiq -C config/sidekiq.yml
    depends_on:
      chatwoot-db:
        condition: service_healthy
      chatwoot-redis:
        condition: service_healthy
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - chatwoot_net

volumes:
  chatwoot_postgres_data:
  chatwoot_redis_data:
  chatwoot_storage:
  chatwoot_public:

networks:
  chatwoot_net:
    driver: bridge
  coolify:
    external: true
